[project]
name = "oriented_superclustering"
version = "0.0.1"
authors = [
  { name="Martine Lokken", email="mlokken@ifae.es" },
]
description = "Constrained oriented stacking for CMB x LSS"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "pandas",
    "pixell",
    "healpy",
    "kmeans_radec @ git+https://github.com/esheldon/kmeans_radec.git",
    "fitsio",
    "h5py",
    "cython",
    "pkgconfig",
    "setuptools",
    "ipykernel"
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]
license = "MIT"


[project.urls]
Homepage = "https://github.com/marlena6/oriented_superclustering.git"
Issues = "https://github.com/marlena6/oriented_superclustering/issues"